//# ————————————————————————————————————————————————————————————————————————————————————————————————————
//# IMPORTANT
//# ————————————————————————————————————————————————————————————————————————————————————————————————————
//#
//# Please read through the config files to understand what each config file does. Each section will
//#	contain information of what it is for and how it changes the game.
//#
//# All settings here are set to their most optimal value. You are free to change the settings.
//#
//# For the purpose of making updating the config seamless and not to override your changes, please make
//# all your changes to config_custom.cfg instead of ultimateconfig.cfg
//#
//# ————————————————————————————————————————————————————————————————————————————————————————————————————

//# ————————————————————————————————————————————————————————————————————————————————————————————————————
//# LEGEND
//# ————————————————————————————————————————————————————————————————————————————————————————————————————
//#
//# [	//#		]	= This is a comment line. Do NOT delete or edit this line.
//# [	//		]	= This means that the command has been commented out so that it will not be executed.
//#					= If you want to execute the command, copy that line to config_custom.cfg and
//#					= delete the // part in that line.
//#
//# ————————————————————————————————————————————————————————————————————————————————————————————————————

//# HOME					-----	Key Home
//# END						-----	Key End
//# PGUP					-----	Key Page Up
//# PGDN					-----	Key Page Down

//# KP_SLASH				-----	Keypad Slash
//# KP_MULTIPLY				-----	Keypad Multiply
//# KP_MINUS				-----	Keypad Minus

//# KP_HOME					-----	Keypad Home/7
//# KP_UPARROW				-----	Keypad Up Arrow/8
//# KP_PGUP					-----	Keypad Page Up/9

//# KP_LEFTARROW			-----	Keypad Left Arrow/4
//# KP_5					-----	Keypad 5
//# KP_RIGHTARROW			-----	Keypad Right Arrow/6

//# KP_END					-----	Keypad End/1
//# KP_DOWNARROW 			-----	Keypad Down Arrow/2
//# KP_PGDN					-----	Keypad Page Down/3

//# KP_INS					-----	Keypad Insert/0
//# KP_DEL					-----	Keypad Delete/.
//# KP_PLUS					-----	Keypad Plus

//# ————————————————————————————————————————————————————————————————————————————————————————————————————

bind "-"							"sur"
bind "="							"inf"
bind "\"							"spec"

bind "KP_SLASH"						"spec"
bind "KP_MULTIPLY"					"sur"
bind "KP_MINUS"						"inf"

//# ————————————————————————————————————————————————————————————————————————————————————————————————————
//# The blocks below are blank callout templates for the HOME/END/PGUP/PGDN/numpad keys while ALT is
//# held. Each key has its own set of aliases (al_action_<key>_0 to _4), so you can fill in the
//# "say_team " lines with your own message and cycle through up to 5 phrases per key, same as the
//# HOME/END/etc. callouts in core_binds_unpressed.cfg (used when ALT is NOT held).
//# ————————————————————————————————————————————————————————————————————————————————————————————————————

//# ————————————————————————————————————————————————————————————————————————————————————————————————————
//# BIND	: HOME
//# ————————————————————————————————————————————————————————————————————————————————————————————————————

bind "HOME"							"al_action_home"

alias "al_action_home"				"al_action_home_0"
alias "al_action_home_0"			"alias al_action_home al_action_home_1; say_team "
alias "al_action_home_1"			"alias al_action_home al_action_home_2; say_team "
alias "al_action_home_2"			"alias al_action_home al_action_home_3; say_team "
alias "al_action_home_3"			"alias al_action_home al_action_home_4; say_team "
alias "al_action_home_4"			"alias al_action_home al_action_home_0; say_team "

