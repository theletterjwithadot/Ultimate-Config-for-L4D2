//# LEGEND
//# ————————————————————————————————————————————————————————————————————————————————————————————————————
//#
//# [	//#		]	= This is a comment line. Do NOT delete or edit this line.
//# [	//		]	= This means that the command has been commented out so that it will not be executed.
//#					= If you want to execute the command, copy that line to config_custom.cfg and
//#					= delete the // part in that line.
//#
//# ————————————————————————————————————————————————————————————————————————————————————————————————————

//# HOME					-----	Key Home
//# END						-----	Key End
//# PGUP					-----	Key Page Up
//# PGDN					-----	Key Page Down

//# KP_SLASH				-----	Keypad Slash
//# KP_MULTIPLY				-----	Keypad Multiply
//# KP_MINUS				-----	Keypad Minus

//# KP_HOME					-----	Keypad Home/7
//# KP_UPARROW				-----	Keypad Up Arrow/8
//# KP_PGUP					-----	Keypad Page Up/9

//# KP_LEFTARROW			-----	Keypad Left Arrow/4
//# KP_5					-----	Keypad 5
//# KP_RIGHTARROW			-----	Keypad Right Arrow/6

//# KP_END					-----	Keypad End/1
//# KP_DOWNARROW 			-----	Keypad Down Arrow/2
//# KP_PGDN					-----	Keypad Page Down/3

//# KP_INS					-----	Keypad Insert/0
//# KP_DEL					-----	Keypad Delete/.
//# KP_PLUS					-----	Keypad Plus

//# ————————————————————————————————————————————————————————————————————————————————————————————————————

bind "-"							"toggle snd_musicvolume 0 0.25 0.5 0.75 1"
bind "="							"toggle volume 0 0.25 0.5 0.75 1"
bind "\"							"toggle cl_viewmodelfovsurvivor 51 60 70 80 90 100 120 180"

bind "KP_SLASH"						"spec"
bind "KP_MULTIPLY"					"sur"
bind "KP_MINUS"						"inf"

//# ————————————————————————————————————————————————————————————————————————————————————————————————————
//# The blocks below are the default callouts for the HOME/END/PGUP/PGDN/numpad keys, active when ALT
//# is NOT held (see core_binds_pressed.cfg for the ALT-held layer on the same keys). Each key has its
//# own set of aliases (al_action_<key>_0 to _4), so feel free to edit the "say_team" lines to your
//# own wording and cycle through up to 5 phrases per key.
//# ————————————————————————————————————————————————————————————————————————————————————————————————————

//# ————————————————————————————————————————————————————————————————————————————————————————————————————
//# BIND	: HOME - TANK SPAWN
//# ————————————————————————————————————————————————————————————————————————————————————————————————————

bind "HOME"							"al_action_home"

alias "al_action_home"				"al_action_home_0"
alias "al_action_home_0"			"alias al_action_home al_action_home_1; say_team TANK! TANK!! TANK!!"
alias "al_action_home_1"			"alias al_action_home al_action_home_2; say_team TANK SPAWNED! TANK SPAWNED!!"
alias "al_action_home_2"			"alias al_action_home al_action_home_3; say_team HOLY SHIT! TANK SPAWNED!!"
alias "al_action_home_3"			"alias al_action_home al_action_home_4; say_team THEY HAVE A TANK! THEY HAVE A TANK!!"
alias "al_action_home_4"			"alias al_action_home al_action_home_0; say_team JEEEEEEEZUS CRIES! GUYS WE HAVE A TANK!! WE HAVE A TANK!!!"

